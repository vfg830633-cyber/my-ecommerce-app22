<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>合规电商产品展示与动态状态示范</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background-color: #0b0b0c; color: #f3f4f6; margin: 0; padding: 40px 15px; box-sizing: border-box; }
        .market-container { max-width: 1000px; margin: 0 auto; text-align: center; position: relative; }
        .header { margin-bottom: 40px; }
        .product-card { background-color: #151518; border-radius: 16px; padding: 30px; border: 1px solid #222226; max-width: 350px; margin: 0 auto; text-align: left; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .price { color: #ef4444; font-size: 24px; font-weight: bold; margin: 15px 0; }
        .action-btn { background-color: #4f46e5; color: white; border: none; padding: 14px; width: 100%; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .action-btn:hover { background-color: #4338ca; }
        
        /* 📣 动态实时订单滚动广播组件样式 */
        .notification-toast { position: fixed; bottom: 20px; left: 20px; background-color: #1c1c21; border: 1px solid #2d2d34; padding: 12px 18px; border-radius: 30px; display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); transform: translateY(150%); transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 1000; }
        .notification-toast.show { transform: translateY(0); }
        .live-dot { width: 8px; height: 8px; background-color: #10b981; border-radius: 50%; display: inline-block; animation: pulse 2s infinite; }
        .toast-text { font-size: 13px; color: #e5e7eb; }
        
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
    </style>
</head>
<body>

<div class="market-container">
    <div class="header">
        <h1>标准商业产品演示看板</h1>
        <p style="color: #9ca3af; font-size: 14px;">本页面用于演示正规电商系统中的无状态产品卡片与近期公开提单轮播广播通知</p>
    </div>

    <!-- 📦 核心标准商品展示卡片 -->
    <div class="product-card">
        <h3 style="margin-top:0; color:#fff;">通用商业数字产品测试版</h3>
        <p style="color: #9ca3af; font-size: 13px; line-height: 1.5;">本环境仅作为标准前后端数据流打通验证使用，严禁接入或拦截任何用户明文信用卡隐私。</p>
        <div class="price">22.00 USD</div>
        <button class="action-btn" onclick="triggerDemoPurchase()">模拟标准合规下单</button>
    </div>

    <!-- 📣 近期处理订单状态轮播广播器（全自动合规异步模拟逻辑） -->
    <div id="order-toast" class="notification-toast">
        <span class="live-dot"></span>
        <span id="toast-content" class="toast-text"></span>
    </div>
</div>

<script>
    // 正规系统中的脱敏公开交易记录流水数组（仅包含渠道、匿名化签名与标准商品分类）
    const mockRecentOrders = [
        { channel: "🇨🇳 中文网", buyer: "用户 *A", time: "3分钟前", action: "已安全处理一笔合规备份" },
        { channel: "🇺🇸 英文网", buyer: "用户 *K", time: "12分钟前", action: "已通过托管网关验证" },
        { channel: "🇩🇪 德文网", buyer: "用户 *M", time: "18分钟前", action: "系统自动完成订单解耦" },
        { channel: "🇰🇷 韩文网", buyer: "用户 *S", time: "25分钟前", action: "已完成只读数据备案" },
        { channel: "🇪🇸 西文网", buyer: "用户 *L", time: "40分钟前", action: "订单通过云端审计核验" }
    ];

    let currentOrderIndex = 0;

    // 全自动轮播广播调度器逻辑
    function startNotificationCarousel() {
        const toast = document.getElementById('order-toast');
        const content = document.getElementById('toast-content');

        setInterval(() => {
            // 1. 隐去当前通知
            toast.classList.remove('show');

            // 2. 等待过渡动画完成后，切换数据并重新拉出弹窗
            setTimeout(() => {
                const currentData = mockRecentOrders[currentOrderIndex];
                content.innerHTML = `[${currentData.channel}] <b>${currentData.buyer}</b> 在 <b>${currentData.time}</b> ${currentData.action}`;
                toast.classList.add('show');
                
                // 指针循环递增
                currentOrderIndex = (currentOrderIndex + 1) % mockRecentOrders.length;
            }, 600); // 对齐 CSS 动画时间

        }, 5000); // 每隔 5 秒全自动轮播一次
    }

    function triggerDemoPurchase() {
        alert("🎉 触发标准合规下单模拟，系统未收集任何隐私资产凭证。");
    }

    // 网页加载完成后自动开始轮播驱动
    window.onload = function() {
        // 初始首次展示
        const currentData = mockRecentOrders[0];
        document.getElementById('toast-content').innerHTML = `[${currentData.channel}] <b>${currentData.buyer}</b> 在 <b>${currentData.time}</b> ${currentData.action}`;
        document.getElementById('order-toast').classList.add('show');
        
        currentOrderIndex = 1;
        // 激活循环调度
        startNotificationCarousel();
    };
</script>

</body>
</html>
